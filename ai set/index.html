<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI娘大战奶龙豆包</title><link rel="stylesheet" href="styles.css"></head>
<body><main id="app"><section id="select-screen" class="screen"><h1>AI娘大战奶龙豆包</h1><p class="sub">选择角色，开始防线作战</p><div id="character-grid" class="character-grid"></div><button id="start-btn" class="primary" disabled>开始战斗</button></section><section id="game-screen" class="screen hidden"><div class="game-wrap"><canvas id="game" width="960" height="540"></canvas><div id="hud" class="hud"><div class="hud-left"><div id="portrait" class="portrait"></div><div><div id="player-name">-</div><div class="bar"><span id="hp-bar"></span></div><div class="bar xp"><span id="xp-bar"></span></div><small>等级 <b id="level">1</b> · 击杀 <b id="kills">0</b></small></div></div><div class="hud-right"><div id="boss-hud" class="boss-hud hidden"><span id="boss-name"></span><div class="bar boss"><span id="boss-bar"></span></div></div><div>技能 <b id="skill-cooldown">就绪</b></div></div></div><div id="upgrade-modal" class="modal hidden"><h2>升级强化</h2><div id="upgrade-options" class="upgrade-options"></div></div><div id="end-modal" class="modal hidden"><img id="end-icon" alt="结果"><h2 id="end-title"></h2><button id="restart-btn" class="primary">重新开始</button></div></div></section></main><script type="module" src="src/main.js"></script></body>
</html>
